<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cờ tướng — đấu hai người, dự án game trong portfolio.">
  <title>Cờ tướng · Đang phát triển</title>
  <style>
    :root {
      --bg: #05060f;
      --panel: rgba(15, 20, 40, .72);
      --line: rgba(120, 170, 255, .18);
      --text: #e8eefc;
      --muted: #8b9ac0;
      --cyan: #38bdf8;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(56, 189, 248, .14), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(167, 139, 250, .14), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(620px, 100%);
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
      text-align: center;
    }
    .icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 22px;
      font-size: 42px;
      background: linear-gradient(145deg, rgba(56, 189, 248, .12), rgba(167, 139, 250, .12));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 14px;
      border: 1px solid rgba(251, 191, 36, .35);
      border-radius: 999px;
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;
      letter-spacing: -.5px;
    }
    h1 span {
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 16px auto 0;
      max-width: 440px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }
    a {
      padding: 12px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, .5); }
    a.primary {
      border-color: transparent;
      background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
      color: #fff;
    }
    .links { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 2; }
    .links a {
      display: inline;
      padding: 0;
      border: 0;
      background: none;
      color: var(--cyan);
      font-size: inherit;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">♟️</div>
    <div class="tag">Đang phát triển</div>
    <h1>Cờ tướng <span>hai người</span></h1>
    <p>
      Bàn cờ 9×10, luật đi quân và phong cấp đang được hoàn thiện.
      Quay lại sau để chơi bản đầy đủ nhé!
    </p>
    <div class="actions">
      <a class="primary" href="../../index.html">← Về trang CV</a>
      <a href="../flap-rush/">Chơi Flap Rush</a>
      <a href="../snake/">Chơi Rắn săn mồi</a>
    </div>
    <div class="links">
      Các game khác:
      <a href="../o-an-quan/">Ô ăn quan</a> ·
      <a href="../snake/">Rắn săn mồi</a>
    </div>
  </main>
</body>
</html>
