<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Tướng Đơn Giản</title>
    <style>
        /* CSS CƠ BẢN */
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #f1c40f;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        /* BÀN CỜ */
        #board {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            grid-template-rows: repeat(10, 50px);
            background-color: #e67e22; /* Màu gỗ */
            border: 4px solid #d35400;
            padding: 5px;
            border-radius: 5px;
        }
        /* Ô CỜ */
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
        }
        /* QUÂN CỜ */
        .piece {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            background-color: #fdf5e6;
            border: 2px solid #333;
            user-select: none;
        }
        .piece.red { color: #e74c3c; border-color: #e74c3c; }
        .piece.black { color: #2c3e50; border-color: #2c3e50; }
        .selected { outline: 3px solid #f1c40f; }
        
        /* THÔNG BÁO LƯỢT ĐI */
        #turn-indicator {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        .red-turn { color: #e74c3c; }
        .black-turn { color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="header">
        <a href="../../index.html" class="back-btn">← Quay lại Portfolio</a>
        <h1>♟️ Cờ Tướng Cơ Bản</h1>
    </div>

    <!-- Bàn cờ 9 cột x 10 hàng -->
    <div id="board"></div>

    <div id="turn-indicator" class="red-turn">Lượt đi: ĐỎ</div>

    <script>
        // 1. KHỞI TẠO DỮ LIỆU BÀN CỜ
        // R = Đỏ (Red), B = Đen (Black), . = Ô trống
        const initialBoard = [
            ["b車", "b馬", "b象", "b士", "b將", "b士", "b象", "b馬", "b車"],
            [".", ".", ".", ".", ".", ".", ".", ".", "."],
            [".", "b炮", ".", ".", ".", ".", ".", "b炮", "."],
            ["b卒", ".", "b卒", ".", "b卒", ".", "b卒", ".", "b卒"],
            [".", ".", ".", ".", ".", ".", ".", ".", "."],
            [".", ".", ".", ".", ".", ".", ".", ".", "."],
            ["r兵", ".", "r兵", ".", "r兵", ".", "r兵", ".", "r兵"],
            [".", "r炮", ".", ".", ".", ".", ".", "r炮", "."],
            [".", ".", ".", ".", ".", ".", ".", ".", "."],
            ["r車", "r馬", "r相", "r仕", "r帥", "r仕", "r相", "r馬", "r車"]
        ];

        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = "red"; // Lượt đi hiện tại
        let selectedRow = -1;
        let selectedCol = -1;
        const boardElement = document.getElementById("board");
        const turnIndicator = document.getElementById("turn-indicator");

        // 2. HÀM VẼ BÀN CỜ
        function renderBoard() {
            boardElement.innerHTML = ""; // Xóa bàn cờ cũ

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    
                    // Nếu có quân cờ
                    if (boardState[r][c] !== ".") {
                        const pieceText = boardState[r][c]; // Ví dụ: "r車" hoặc "b將"
                        const pieceColor = pieceText[0] === 'r' ? "red" : "black";
                        const pieceChar = pieceText[1];

                        const piece = document.createElement("div");
                        piece.className = `piece ${pieceColor}`;
                        piece.innerText = pieceChar;
                        
                        // Đánh dấu quân cờ đang chọn
                        if (r === selectedRow && c === selectedCol) {
                            piece.classList.add("selected");
                        }
                        cell.appendChild(piece);
                    }

                    // Gắn sự kiện click
                    cell.addEventListener("click", () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
            updateTurnIndicator();
        }

        // 3. LOGIC XỬ LÝ CLICK (DI CHUYỂN)
        function handleCellClick(r, c) {
            const clickedPiece = boardState[r][c];

            // Nếu chưa chọn quân nào
            if (selectedRow === -1 && selectedCol === -1) {
                // Chỉ được chọn quân của mình
                if (clickedPiece !== "." && clickedPiece[0] === turn[0]) {
                    selectedRow = r;
                    selectedCol = c;
                    renderBoard();
                }
                return;
            }

            // Nếu đang chọn quân, bấm lại vào chính nó -> Bỏ chọn
            if (selectedRow === r && selectedCol === c) {
                selectedRow = -1;
                selectedCol = -1;
                renderBoard();
                return;
            }

            // Nếu bấm sang ô khác
            const targetPiece = boardState[r][c];
            
            // Không được ăn quân của mình
            if (targetPiece !== "." && targetPiece[0] === turn[0]) {
                // Chuyển sang chọn quân mới
                selectedRow = r;
                selectedCol = c;
                renderBoard();
                return;
            }

            // Thực hiện di chuyển (ăn quân địch hoặc đi vào ô trống)
            boardState[r][c] = boardState[selectedRow][selectedCol];
            boardState[selectedRow][selectedCol] = ".";

            // Đổi lượt
            turn = turn === "red" ? "black" : "red";
            
            // Reset lựa chọn
            selectedRow = -1;
            selectedCol = -1;
            renderBoard();
        }

        // 4. CẬP NHẬT DÒNG CHỮ LƯỢT ĐI
        function updateTurnIndicator() {
            if (turn === "red") {
                turnIndicator.innerText = "Lượt đi: ĐỎ";
                turnIndicator.className = "red-turn";
            } else {
                turnIndicator.innerText = "Lượt đi: ĐEN";
                turnIndicator.className = "black-turn";
            }
        }

        // Bắt đầu game
        renderBoard();
    </script>
</body>
</html>
