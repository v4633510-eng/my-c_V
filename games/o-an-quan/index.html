<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ô Ăn Quan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .back-btn {
            color: #f1c40f;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .back-btn:hover { text-decoration: underline; }

        /* BÀN CỜ Ô ĂN QUAN */
        #board {
            display: flex;
            background-color: #d35400;
            border: 5px solid #8e44ad;
            border-radius: 10px;
            padding: 5px;
            gap: 5px;
            margin-bottom: 20px;
        }

        /* Ô Quan (2 bên) */
        .quan {
            width: 100px;
            height: 200px;
            background-color: #e67e22;
            border-radius: 50px 0 0 50px; /* Bo góc trái */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #a04000;
            position: relative;
        }
        .quan.right { border-radius: 0 50px 50px 0; } /* Bo góc phải */

        /* Ô dân (10 ô nhỏ) */
        .dans {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(2, 100px);
            gap: 5px;
        }
        .dan {
            background-color: #e67e22;
            border: 2px solid #a04000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            transition: background 0.2s;
        }
        .dan:hover, .quan:hover { background-color: #f39c12; }

        /* Hiệu ứng đánh dấu ô đang chọn */
        .selected { outline: 4px solid #f1c40f; }

        /* BẢNG ĐIỂM */
        .scoreboard {
            display: flex;
            gap: 50px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .p1 { color: #e74c3c; }
        .p2 { color: #3498db; }
        #turn-indicator { font-size: 18px; margin-bottom: 15px; }

        .btn-reset {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../../index.html" class="back-btn">← Quay lại Portfolio</a>
        <h1>Trò Chơi Ô Ăn Quan</h1>
    </div>

    <div class="scoreboard">
        <div class="p1">Người chơi Đỏ: <span id="score-p1">0</span></div>
        <div class="p2">Người chơi Xanh: <span id="score-p2">0</span></div>
    </div>

    <div id="turn-indicator">Lượt đi: Người chơi Đỏ</div>

    <div id="board">
        <div class="quan" id="quan-0"></div>
        <div class="dans" id="board-dans"></div>
        <div class="quan right" id="quan-6"></div>
    </div>

    <button class="btn-reset" onclick="resetGame()">Chơi Lại</button>

    <script>
        // Mảng lưu trữ số lượng quân (12 ô: 0 là Quan Trái, 1-10 là ô Dân, 11 là Quan Phải)
        // Quy ước: 1 Quan = 10 điểm. Ô dân bắt đầu với 5 quân.
        let board = [];
        let scoreP1 = 0, scoreP2 = 0;
        let turn = "p1"; // p1 (Đỏ) đi trước
        let isAnimating = false; // Chặn click khi đang rải quân

        const quanLeftEl = document.getElementById('quan-0');
        const quanRightEl = document.getElementById('quan-6');
        const dansEl = document.getElementById('board-dans');
        const turnIndicator = document.getElementById('turn-indicator');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');

        // Hàm khởi tạo lại bàn cờ
        function resetGame() {
            board = [10, 5, 5, 5, 5, 5, 10, 5, 5, 5, 5, 5];
            scoreP1 = 0; scoreP2 = 0; turn = "p1"; isAnimating = false;
            render();
        }

        // Hàm vẽ bàn cờ
        function render() {
            // Cập nhật điểm
            scoreP1El.innerText = scoreP1;
            scoreP2El.innerText = scoreP2;
            turnIndicator.innerText = turn === "p1" ? "Lượt đi: Người chơi Đỏ" : "Lượt đi: Người chơi Xanh";
            turnIndicator.className = turn === "p1" ? "p1" : "p2";

            // Vẽ 2 ô Quan
            quanLeftEl.innerText = board[0] > 0 ? board[0] + " Quan" : "Hết";
            quanRightEl.innerText = board[6] > 0 ? board[6] + " Quan" : "Hết";

            // Vẽ 10 ô Dân
            dansEl.innerHTML = "";
            // Hàng trên (P2) từ 7 đến 11 (hiển thị từ phải sang trái: 11, 10, 9, 8, 7)
            // Hàng dưới (P1) từ 1 đến 5 (hiển thị từ trái sang phải: 1, 2, 3, 4, 5)
            
            // Vẽ hàng trên
            for (let i = 11; i >= 7; i--) {
                let cell = document.createElement("div");
                cell.className = "dan p2-cell";
                cell.innerText = board[i];
                cell.onclick = () => handleClick(i);
                dansEl.appendChild(cell);
            }
            // Vẽ hàng dưới
            for (let i = 1; i <= 5; i++) {
                let cell = document.createElement("div");
                cell.className = "dan p1-cell";
                cell.innerText = board[i];
                cell.onclick = () => handleClick(i);
                dansEl.appendChild(cell);
            }
        }

        // Xử lý khi click vào ô
        async function handleClick(index) {
            if (isAnimating) return;

            // Kiểm tra xem có đúng lượt không và ô đó có quân không
            if (turn === "p1" && (index < 1 || index > 5)) return; // P1 chỉ được chọn ô 1-5
            if (turn === "p2" && (index < 7 || index > 11)) return; // P2 chỉ được chọn ô 7-11
            if (board[index] === 0) return;

            isAnimating = true;
            let stones = board[index];
            board[index] = 0;
            
            // Rải quân (ngược chiều kim đồng hồ)
            let currentIdx = index;
            let lastIndex = -1;
            
            while (stones > 0) {
                currentIdx = (currentIdx + 1) % 12; // Chạy vòng quanh 12 ô
                board[currentIdx]++;
                stones--;
                lastIndex = currentIdx;
                render();
                
                // Tạo hiệu ứng delay nhẹ để người chơi thấy quân đang rải
                await new Promise(r => setTimeout(r, 150)); 
            }

            // XỬ LÝ ĂN QUÂN (Luật đơn giản: Rải xong, nếu ô liền sau có quân thì ăn)
            let nextIdx = (lastIndex + 1) % 12;
            
            // Không được ăn quân ở ô mình vừa rải (nếu vòng lại chính nó)
            if (nextIdx !== currentIdx && board[nextIdx] > 0) {
                let captured = board[nextIdx];
                board[nextIdx] = 0;
                
                if (turn === "p1") {
                    scoreP1 += captured;
                } else {
                    scoreP2 += captured;
                }
            }

            // Đổi lượt
            turn = turn === "p1" ? "p2" : "p1";
            isAnimating = false;
            render();
        }

        // Khởi động game
        resetGame();
    </script>
</body>
</html>
