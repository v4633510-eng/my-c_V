<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        canvas {
            background-color: #0f172a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid #334155;
            border-radius: 8px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
            display: none;
            z-index: 10;
        }

        .game-over h2 {
            color: #ef4444;
            margin-top: 0;
        }

        .game-over p {
            font-size: 1.2rem;
        }

        button {
            background-color: #4ade80;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

    <h1>SNAKE.IO</h1>
    <div class="score-board">Điểm: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="game-over" id="gameOverScreen">
        <h2>GAME OVER!</h2>
        <p>Điểm của bạn: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Chơi Lại</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');

        // Cấu hình game
        const gridSize = 20; // Kích thước mỗi ô vuông (pixel)
        const tileCount = canvas.width / gridSize; // Số ô trên bàn cờ (20x20)

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let isGameOver = false;
        let speed = 120; // Tốc độ (ms), càng nhỏ càng nhanh

        // Khởi tạo game
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            dx = 0;
            dy = -1; // Ban đầu đi lên
            score = 0;
            scoreElement.innerText = score;
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            generateFood();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        // Tạo thức ăn ngẫu nhiên
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Đảm bảo thức ăn không rơi vào thân rắn
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        // Cập nhật trạng thái game (chạy liên tục)
        function update() {
            if (isGameOver) return;

            // Tính toán vị trí đầu rắn mới
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Kiểm tra va chạm với tường
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Kiểm tra va chạm với chính mình
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            // Thêm đầu mới vào mảng
            snake.unshift(head);

            // Kiểm tra ăn mồi
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood(); // Tạo mồi mới
                // Không pop() ở đây để rắn dài ra
            } else {
                // Nếu không ăn mồi, cắt bỏ phần đuôi
                snake.pop();
            }

            draw();
        }

        // Vẽ mọi thứ lên màn hình
        function draw() {
            // Xóa màn hình
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ thức ăn (Màu đỏ)
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // Vẽ rắn
            ctx.shadowBlur = 0; // Tắt bóng đổ cho rắn
            for (let i = 0; i < snake.length; i++) {
                // Đầu rắn màu sáng hơn, thân rắn màu tối hơn chút
                ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }
        }

        // Kết thúc game
        function endGame() {
            isGameOver = true;
            clearInterval(gameLoop);
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        // Reset game
        function resetGame() {
            initGame();
        }

        // Xử lý sự kiện bàn phím
        document.addEventListener('keydown', (e) => {
            // Ngăn không cho cuộn trang khi chơi
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
                e.preventDefault();
            }

            // Không cho rắn quay đầu 180 độ
            if ((e.key === 'ArrowUp' || e.key === 'w') && dy !== 1) { dx = 0; dy = -1; }
            if ((e.key === 'ArrowDown' || e.key === 's') && dy !== -1) { dx = 0; dy = 1; }
            if ((e.key === 'ArrowLeft' || e.key === 'a') && dx !== 1) { dx = -1; dy = 0; }
            if ((e.key === 'ArrowRight' || e.key === 'd') && dx !== -1) { dx = 1; dy = 0; }
        });

        // Bắt đầu game
        initGame();
    </script>
</body>
</html>
